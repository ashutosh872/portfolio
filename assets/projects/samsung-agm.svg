    <circle cx="680" cy="80" r="160" fill="#10b981" opacity="0.18" filter="blur(40px)" />
    <circle cx="120" cy="360" r="130" fill="#38bdf8" opacity="0.12" filter="blur(30px)" />

    <!-- App Header -->
    <rect width="800" height="48" fill="#000000" fill-opacity="0.3" />
