<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-wondrfly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cardBg-wondrfly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="accentGlow-wondrfly" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="800" height="500" rx="14" fill="#0d1117" />
  
  <!-- Browser Chrome Topbar -->
  <rect width="800" height="42" rx="14" fill="#161b22" />
  <rect y="24" width="800" height="18" fill="#161b22" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- URL Address Bar -->
  <rect x="170" y="9" width="460" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <g transform="translate(184, 15)">
    <path d="M4 5.5V3.5C4 2.1 5.1 1 6.5 1s2.5 1.1 2.5 2.5v2m-6 0h7a1 1 0 011 1v4a1 1 0 01-1 1h-7a1 1 0 01-1-1v-4a1 1 0 011-1z" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round"/>
    <text x="18" y="9.5" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">https://wondrfly.com</text>
  </g>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    <rect width="800" height="458" fill="url(#bg-wondrfly)" />

    <!-- Ambient background gradients -->
    <circle cx="680" cy="80" r="160" fill="#818cf8" opacity="0.18" filter="blur(40px)" />
    <circle cx="120" cy="360" r="130" fill="#f59e0b" opacity="0.12" filter="blur(30px)" />

    <!-- App Header -->
    <rect width="800" height="48" fill="#000000" fill-opacity="0.3" />
    <line x1="0" y1="48" x2="800" y2="48" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <rect x="36" y="14" width="20" height="20" rx="5" fill="url(#accentGlow-wondrfly)" />
    <text x="64" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Wondrfly</text>

    <!-- Header navigation items mock -->
    <g transform="translate(480, 18)">
      <rect x="0" y="0" width="50" height="12" rx="6" fill="#ffffff" fill-opacity="0.15" />
      <rect x="65" y="0" width="50" height="12" rx="6" fill="#ffffff" fill-opacity="0.15" />
      <rect x="130" y="0" width="50" height="12" rx="6" fill="#ffffff" fill-opacity="0.15" />
      <rect x="195" y="-3" width="85" height="20" rx="10" fill="url(#accentGlow-wondrfly)" />
      <text x="237" y="11" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PRODUCTION</text>
    </g>

    <!-- Specific Mockup UI -->
    
        <!-- Search bar -->
        <g transform="translate(36, 68)">
