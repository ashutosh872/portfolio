<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-samsung-metadata" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardBg-samsung-metadata" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="accentGlow-samsung-metadata" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="800" height="500" rx="14" fill="#0d1117" />
  
  <!-- Browser Chrome Topbar -->
  <rect width="800" height="42" rx="14" fill="#161b22" />
  <rect y="24" width="800" height="18" fill="#161b22" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- URL Address Bar -->
  <rect x="170" y="9" width="460" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <g transform="translate(184, 15)">
    <path d="M4 5.5V3.5C4 2.1 5.1 1 6.5 1s2.5 1.1 2.5 2.5v2m-6 0h7a1 1 0 011 1v4a1 1 0 01-1 1h-7a1 1 0 01-1-1v-4a1 1 0 011-1z" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
    <text x="18" y="9.5" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">https://metadata.samsung-sds.internal</text>
  </g>

  <!-- Body Content -->
