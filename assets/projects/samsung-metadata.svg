    <rect x="28" y="13" width="20" height="20" rx="5" fill="url(#accent-samsung)" />
    <text x="56" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Samsung SDS • Enterprise Metadata Platform</text>
