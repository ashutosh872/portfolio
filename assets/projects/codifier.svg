<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-codifier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="cardBg-codifier" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="accentGlow-codifier" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="800" height="500" rx="14" fill="#0d1117" />
  
  <!-- Browser Chrome Topbar -->
  <rect width="800" height="42" rx="14" fill="#161b22" />
  <rect y="24" width="800" height="18" fill="#161b22" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- URL Address Bar -->
  <rect x="170" y="9" width="460" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <g transform="translate(184, 15)">
    <path d="M4 5.5V3.5C4 2.1 5.1 1 6.5 1s2.5 1.1 2.5 2.5v2m-6 0h7a1 1 0 011 1v4a1 1 0 01-1 1h-7a1 1 0 01-1-1v-4a1 1 0 011-1z" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round"/>
    <text x="18" y="9.5" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">https://codifier.in</text>
  </g>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    <rect width="800" height="458" fill="url(#bg-codifier)" />

    <!-- Ambient background gradients -->
    <circle cx="680" cy="80" r="160" fill="#2dd4bf" opacity="0.18" filter="blur(40px)" />
    <circle cx="120" cy="360" r="130" fill="#a7f3d0" opacity="0.12" filter="blur(30px)" />

    <!-- App Header -->
    <rect width="800" height="48" fill="#000000" fill-opacity="0.3" />
    <line x1="0" y1="48" x2="800" y2="48" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <rect x="36" y="14" width="20" height="20" rx="5" fill="url(#accentGlow-codifier)" />
    <text x="64" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Codifier Technologies</text>

    <!-- Header navigation items mock -->
    <g transform="translate(480, 18)">
      <rect x="0" y="0" width="50" height="12" rx="6" fill="#ffffff" fill-opacity="0.15" />
      <rect x="65" y="0" width="50" height="12" rx="6" fill="#ffffff" fill-opacity="0.15" />
      <rect x="130" y="0" width="50" height="12" rx="6" fill="#ffffff" fill-opacity="0.15" />
      <rect x="195" y="-3" width="85" height="20" rx="10" fill="url(#accentGlow-codifier)" />
      <text x="237" y="11" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PRODUCTION</text>
    </g>

    <!-- Specific Mockup UI -->
    
        <g transform="translate(36, 68)">
          <rect width="728" height="140" rx="12" fill="url(#cardBg-codifier)" stroke="#2dd4bf" stroke-opacity="0.3"/>
          <text x="30" y="44" fill="#ffffff" font-family="system-ui" font-size="24" font-weight="800">Engineering Digital Products with Precision</text>
          <text x="30" y="70" fill="#ccfbf1" font-family="system-ui" font-size="13">High-converting web applications, scalable design systems, and responsive email architectures.</text>
          <g transform="translate(30, 92)">
            <rect width="130" height="32" rx="6" fill="url(#accentGlow-codifier)"/>
            <text x="65" y="20" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Our Portfolio</text>
            <rect x="140" y="0" width="120" height="32" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
            <text x="200" y="20" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">Hire Engineers</text>
          </g>
        </g>
        <g transform="translate(36, 220)">
          <rect width="232" height="185" rx="10" fill="url(#cardBg-codifier)" stroke="#ffffff" stroke-opacity="0.1"/>
          <text x="20" y="32" fill="#2dd4bf" font-family="system-ui" font-size="12" font-weight="700">01 / FRONTEND ARCHITECTURE</text>
          <text x="20" y="58" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">Angular &amp; Modern JS</text>
          <text x="20" y="80" fill="#ccfbf1" font-family="system-ui" font-size="11">Production component design systems with pixel-perfect Figma/PSD translations.</text>
          <rect x="20" y="145" width="80" height="20" rx="10" fill="#2dd4bf" fill-opacity="0.2"/>
          <text x="60" y="159" fill="#2dd4bf" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">WCAG 2.1</text>

          <g transform="translate(248, 0)">
            <rect width="232" height="185" rx="10" fill="url(#cardBg-codifier)" stroke="#ffffff" stroke-opacity="0.1"/>
            <text x="20" y="32" fill="#a7f3d0" font-family="system-ui" font-size="12" font-weight="700">02 / EMAIL TEMPLATING</text>
            <text x="20" y="58" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">Cross-Client Verified</text>
            <text x="20" y="80" fill="#ccfbf1" font-family="system-ui" font-size="11">Tested across Outlook, Gmail, Apple Mail, and mobile responsive web clients.</text>
            <rect x="20" y="145" width="80" height="20" rx="10" fill="#a7f3d0" fill-opacity="0.2"/>
            <text x="60" y="159" fill="#a7f3d0" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">100% Verified</text>
          </g>

          <g transform="translate(496, 0)">
            <rect width="232" height="185" rx="10" fill="url(#cardBg-codifier)" stroke="#ffffff" stroke-opacity="0.1"/>
            <text x="20" y="32" fill="#22c55e" font-family="system-ui" font-size="12" font-weight="700">03 / WEB PERFORMANCE</text>
            <text x="20" y="58" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">Core Web Vitals</text>
            <text x="20" y="80" fill="#ccfbf1" font-family="system-ui" font-size="11">Optimized LCP, CLS, and FID metrics delivering lightning-fast responsive speed.</text>
            <rect x="20" y="145" width="80" height="20" rx="10" fill="#22c55e" fill-opacity="0.2"/>
            <text x="60" y="159" fill="#22c55e" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">98+ Score</text>
          </g>
        </g>
      
  </g>
</svg>