<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cisco-sdwan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051a2e" />
      <stop offset="100%" stop-color="#0a2540" />
    </linearGradient>
    <linearGradient id="accent-sdwan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="800" height="500" rx="14" fill="#0d1117" />
  
  <!-- Window Chrome Topbar -->
  <rect width="800" height="42" rx="14" fill="#161b22" />
  <rect y="24" width="800" height="18" fill="#161b22" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- URL Address Bar: Sanitized / NDA -->
  <rect x="170" y="9" width="460" height="24" rx="12" fill="#051a2e" stroke="#30363d" stroke-width="1" />
  <g transform="translate(184, 15)">
    <!-- Lock Icon -->
    <path d="M4 5.5V3.5C4 2.1 5.1 1 6.5 1s2.5 1.1 2.5 2.5v2m-6 0h7a1 1 0 011 1v4a1 1 0 01-1 1h-7a1 1 0 01-1-1v-4a1 1 0 011-1z" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <text x="18" y="9.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Enterprise Internal Platform • Sanitized Wireframe (NDA Compliant)</text>
  </g>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    <rect width="800" height="458" fill="url(#bg-cisco-sdwan)" />

    <!-- Ambient Glows -->
    <circle cx="680" cy="90" r="140" fill="#06b6d4" opacity="0.08" />
    <circle cx="120" cy="380" r="140" fill="#0284c7" opacity="0.06" />

    <!-- Platform Header -->
    <rect width="800" height="46" fill="#000000" fill-opacity="0.35" />
    <line x1="0" y1="46" x2="800" y2="46" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <rect x="28" y="13" width="20" height="20" rx="5" fill="url(#accent-sdwan)" />
    <text x="56" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Cisco • SD-WAN UI Engineering &amp; Dashboard Layout</text>
    <text x="56" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Responsive Multi-Breakpoint Grid Architecture (1920px • 1440px • 1024px)</text>

    <!-- NDA Security Pill Badge -->
    <g transform="translate(565, 12)">
      <rect width="205" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="12" cy="11" r="3.5" fill="#f59e0b" />
      <text x="22" y="15" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">INTERNAL PLATFORM • NDA SAFE</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(28, 62)">
      
      <!-- Top 3 Metric Cards Skeleton -->
      <g>
        <!-- Card 1 -->
        <rect width="234" height="74" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#00d2d3" stroke-opacity="0.3" />
        <text x="16" y="22" fill="#8892b0" font-family="system-ui" font-size="8.5" font-weight="600">LAYOUT SYSTEM</text>
        <text x="16" y="46" fill="#38bdf8" font-family="system-ui" font-size="16" font-weight="800">12-Col Grid</text>
        <text x="16" y="62" fill="#22c55e" font-family="system-ui" font-size="8.5">Fluid Responsive Layout</text>

        <!-- Card 2 -->
        <g transform="translate(255, 0)">
          <rect width="234" height="74" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="16" y="22" fill="#8892b0" font-family="system-ui" font-size="8.5" font-weight="600">ACCESSIBILITY STANDARD</text>
          <text x="16" y="46" fill="#64ffda" font-family="system-ui" font-size="16" font-weight="800">Section 508</text>
          <text x="16" y="62" fill="#64ffda" font-family="system-ui" font-size="8.5">WCAG 2.1 Compliant</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(510, 0)">
          <rect width="234" height="74" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
          <text x="16" y="22" fill="#8892b0" font-family="system-ui" font-size="8.5" font-weight="600">THEMING &amp; UI ENGINE</text>
          <text x="16" y="46" fill="#a78bfa" font-family="system-ui" font-size="16" font-weight="800">Angular UI</text>
          <text x="16" y="62" fill="#94a3b8" font-family="system-ui" font-size="8.5">Enterprise Components</text>
        </g>
      </g>

      <!-- Main Visual Layout Skeleton: Telemetry & Topology Chart -->
      <g transform="translate(0, 88)">
        <rect width="744" height="200" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="20" y="24" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">Network Telemetry &amp; Latency Heatmap Component Blueprint</text>
        <text x="20" y="38" fill="#64748b" font-family="system-ui" font-size="8.5">Abstract representation of real-time multi-series SVG chart rendering</text>

        <!-- Chart Grid Lines -->
        <g stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3">
          <line x1="20" y1="70" x2="724" y2="70" />
          <line x1="20" y1="110" x2="724" y2="110" />
          <line x1="20" y1="150" x2="724" y2="150" />
        </g>

        <!-- Synthetic Graph Lines (Neutral blueprint representation) -->
        <path d="M 30 135 Q 120 70 210 115 T 390 90 T 570 130 T 710 75" fill="none" stroke="#00d2d3" stroke-width="2.5" />
        <path d="M 30 150 Q 120 115 210 135 T 390 120 T 570 145 T 710 105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4" />

        <!-- Chart Nodes -->
        <circle cx="210" cy="115" r="4.5" fill="#00d2d3" />
        <circle cx="390" cy="90" r="4.5" fill="#00d2d3" />
        <circle cx="570" cy="130" r="4.5" fill="#00d2d3" />
        <circle cx="710" cy="75" r="4.5" fill="#00d2d3" />

        <!-- Legend -->
        <g transform="translate(20, 172)">
          <rect x="0" y="0" width="10" height="10" rx="2" fill="#00d2d3" />
          <text x="16" y="9" fill="#8892b0" font-family="system-ui" font-size="9">Metric Series Alpha</text>
          
          <rect x="150" y="0" width="10" height="10" rx="2" fill="#38bdf8" />
          <text x="166" y="9" fill="#8892b0" font-family="system-ui" font-size="9">Baseline Comparison</text>

          <rect x="300" y="0" width="10" height="10" rx="2" fill="#22c55e" />
          <text x="316" y="9" fill="#8892b0" font-family="system-ui" font-size="9">SLA Threshold (100% Up)</text>
        </g>
      </g>

      <!-- Bottom Notice -->
      <g transform="translate(0, 300)">
        <rect width="744" height="68" rx="8" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="16" y="22" fill="#38bdf8" font-family="system-ui" font-size="9" font-weight="700">[CONFIDENTIALITY • CISCO ENTERPRISE SYSTEMS]</text>
        <text x="16" y="40" fill="#cbd5e1" font-family="system-ui" font-size="9">• All proprietary network parameters, device telemetry, and internal hostnames are fully sanitized.</text>
        <text x="16" y="56" fill="#64748b" font-family="system-ui" font-size="8">🔒 Pure frontend UI architecture demonstration in strict compliance with corporate Non-Disclosure Agreements (NDA).</text>
      </g>
    </g>
  </g>
</svg>
