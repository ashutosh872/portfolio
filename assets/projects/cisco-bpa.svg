<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cisco-bpa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041829" />
      <stop offset="100%" stop-color="#082b47" />
    </linearGradient>
    <linearGradient id="accent-cisco" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bceb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="800" height="500" rx="14" fill="#0d1117" />
  
  <!-- Window Chrome Topbar -->
  <rect width="800" height="42" rx="14" fill="#161b22" />
  <rect y="24" width="800" height="18" fill="#161b22" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- URL Address Bar: Sanitized / NDA -->
  <rect x="170" y="9" width="460" height="24" rx="12" fill="#041829" stroke="#30363d" stroke-width="1" />
  <g transform="translate(184, 15)">
    <!-- Lock Icon -->
    <path d="M4 5.5V3.5C4 2.1 5.1 1 6.5 1s2.5 1.1 2.5 2.5v2m-6 0h7a1 1 0 011 1v4a1 1 0 01-1 1h-7a1 1 0 01-1-1v-4a1 1 0 011-1z" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <text x="18" y="9.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Enterprise Internal Platform • Sanitized Wireframe (NDA Compliant)</text>
  </g>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    <rect width="800" height="458" fill="url(#bg-cisco-bpa)" />

    <!-- Ambient Glows -->
    <circle cx="680" cy="90" r="140" fill="#00bceb" opacity="0.08" />
    <circle cx="120" cy="380" r="140" fill="#38bdf8" opacity="0.06" />

    <!-- Platform Header -->
    <rect width="800" height="46" fill="#000000" fill-opacity="0.35" />
    <line x1="0" y1="46" x2="800" y2="46" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <rect x="28" y="13" width="20" height="20" rx="5" fill="url(#accent-cisco)" />
    <text x="56" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Cisco • Business Process Automation (BPA) Portal</text>
    <text x="56" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Enterprise Orchestration Canvas &amp; Form Architecture</text>

    <!-- NDA Security Pill Badge -->
    <g transform="translate(565, 12)">
      <rect width="205" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="12" cy="11" r="3.5" fill="#f59e0b" />
      <text x="22" y="15" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">INTERNAL PLATFORM • NDA SAFE</text>
    </g>

    <!-- Canvas Workflow Blueprint -->
    <g transform="translate(28, 62)">
      
      <!-- Workflow Builder Control Bar -->
      <rect width="744" height="42" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="14" y="10" width="110" height="22" rx="4" fill="#00bceb" fill-opacity="0.2" stroke="#00bceb" stroke-opacity="0.4" />
      <text x="69" y="24" fill="#38bdf8" font-family="system-ui" font-size="9.5" font-weight="700" text-anchor="middle">CANVAS ENGINE</text>
      
      <text x="140" y="25" fill="#e2e8f0" font-family="system-ui" font-size="10.5" font-weight="600">Dynamic Multi-Step Workflow Visualizer</text>

      <rect x="620" y="10" width="110" height="22" rx="4" fill="#00bceb" />
      <text x="675" y="24" fill="#041829" font-family="system-ui" font-size="9.5" font-weight="700" text-anchor="middle">+ ADD NODE</text>

      <!-- Main Node-Graph Flow Container -->
      <g transform="translate(0, 54)">
        <rect width="744" height="200" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#00bceb" stroke-opacity="0.2" />

        <!-- Node 1: Form Input -->
        <g transform="translate(24, 40)">
          <rect width="145" height="100" rx="8" fill="#04233a" stroke="#00bceb" stroke-width="1.5" />
          <rect x="12" y="12" width="70" height="14" rx="7" fill="#00bceb" fill-opacity="0.2" />
          <text x="47" y="22" fill="#38bdf8" font-family="system-ui" font-size="7.5" font-weight="700" text-anchor="middle">STEP 1</text>
          
          <text x="12" y="44" fill="#ffffff" font-family="system-ui" font-size="10.5" font-weight="700">Form Trigger UI</text>
          <text x="12" y="60" fill="#94a3b8" font-family="system-ui" font-size="8.5">Angular Reactive Form</text>
          <circle cx="128" cy="82" r="5" fill="#22c55e" />

          <!-- Connecting Arrow 1 -->
          <line x1="145" y1="50" x2="195" y2="50" stroke="#00bceb" stroke-width="2" stroke-dasharray="4" />
          <polygon points="195,50 187,46 187,54" fill="#00bceb" />
        </g>

        <!-- Node 2: Validation Rule -->
        <g transform="translate(195, 40)">
          <rect width="145" height="100" rx="8" fill="#04233a" stroke="#00bceb" stroke-width="1.5" />
          <rect x="12" y="12" width="70" height="14" rx="7" fill="#00bceb" fill-opacity="0.2" />
          <text x="47" y="22" fill="#38bdf8" font-family="system-ui" font-size="7.5" font-weight="700" text-anchor="middle">STEP 2</text>
          
          <text x="12" y="44" fill="#ffffff" font-family="system-ui" font-size="10.5" font-weight="700">Schema Validator</text>
          <text x="12" y="60" fill="#94a3b8" font-family="system-ui" font-size="8.5">Client-side Validation</text>
          <circle cx="128" cy="82" r="5" fill="#22c55e" />

          <!-- Connecting Arrow 2 -->
          <line x1="145" y1="50" x2="195" y2="50" stroke="#00bceb" stroke-width="2" stroke-dasharray="4" />
          <polygon points="195,50 187,46 187,54" fill="#00bceb" />
        </g>

        <!-- Node 3: Transformation -->
        <g transform="translate(366, 40)">
          <rect width="145" height="100" rx="8" fill="#04233a" stroke="#00bceb" stroke-width="1.5" />
          <rect x="12" y="12" width="70" height="14" rx="7" fill="#00bceb" fill-opacity="0.2" />
          <text x="47" y="22" fill="#38bdf8" font-family="system-ui" font-size="7.5" font-weight="700" text-anchor="middle">STEP 3</text>
          
          <text x="12" y="44" fill="#ffffff" font-family="system-ui" font-size="10.5" font-weight="700">Data Mapper</text>
          <text x="12" y="60" fill="#94a3b8" font-family="system-ui" font-size="8.5">State Transform</text>
          <circle cx="128" cy="82" r="5" fill="#22c55e" />

          <!-- Connecting Arrow 3 -->
          <line x1="145" y1="50" x2="195" y2="50" stroke="#00bceb" stroke-width="2" stroke-dasharray="4" />
          <polygon points="195,50 187,46 187,54" fill="#00bceb" />
        </g>

        <!-- Node 4: Output / Target -->
        <g transform="translate(537, 40)">
          <rect width="145" height="100" rx="8" fill="#04233a" stroke="#22c55e" stroke-width="1.5" />
          <rect x="12" y="12" width="70" height="14" rx="7" fill="#22c55e" fill-opacity="0.2" />
          <text x="47" y="22" fill="#22c55e" font-family="system-ui" font-size="7.5" font-weight="700" text-anchor="middle">COMPLETED</text>
          
          <text x="12" y="44" fill="#ffffff" font-family="system-ui" font-size="10.5" font-weight="700">API Dispatcher</text>
          <text x="12" y="60" fill="#94a3b8" font-family="system-ui" font-size="8.5">Async State Event</text>
          <circle cx="128" cy="82" r="5" fill="#22c55e" />
        </g>
      </g>

      <!-- Technical Telemetry Box (Sanitized) -->
      <g transform="translate(0, 264)">
        <rect width="744" height="104" rx="8" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="16" y="24" fill="#38bdf8" font-family="system-ui" font-size="9" font-weight="700">[ENGINEERING HIGHLIGHTS • CISCO CLIENT PLATFORM]</text>
        <text x="16" y="44" fill="#e2e8f0" font-family="system-ui" font-size="9.5">• Modular component hierarchy built using HTML5, SCSS, Bootstrap, and Angular Material UI</text>
        <text x="16" y="62" fill="#e2e8f0" font-family="system-ui" font-size="9.5">• Strict Section 508 and WCAG 2.1 accessibility adherence across enterprise form controls</text>
        <text x="16" y="80" fill="#e2e8f0" font-family="system-ui" font-size="9.5">• Automated cross-browser test validation with zero layout clipping across enterprise viewports</text>
        <text x="16" y="96" fill="#64748b" font-family="system-ui" font-size="8">🔒 Abstract architectural wireframe • Confidential network parameters and operator data masked under NDA</text>
      </g>
    </g>
  </g>
</svg>
