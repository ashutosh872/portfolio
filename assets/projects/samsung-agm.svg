<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-samsung-agm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-agm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="800" height="500" rx="14" fill="#0d1117" />
  
  <!-- Window Chrome Topbar -->
  <rect width="800" height="42" rx="14" fill="#161b22" />
  <rect y="24" width="800" height="18" fill="#161b22" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- URL Address Bar: Sanitized / NDA -->
  <rect x="170" y="9" width="460" height="24" rx="12" fill="#0a121e" stroke="#30363d" stroke-width="1" />
  <g transform="translate(184, 15)">
    <!-- Lock Icon -->
    <path d="M4 5.5V3.5C4 2.1 5.1 1 6.5 1s2.5 1.1 2.5 2.5v2m-6 0h7a1 1 0 011 1v4a1 1 0 01-1 1h-7a1 1 0 01-1-1v-4a1 1 0 011-1z" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <text x="18" y="9.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Enterprise Internal Platform • Sanitized Wireframe (NDA Compliant)</text>
  </g>

  <!-- Body Content -->
  <g transform="translate(0, 42)">
    <rect width="800" height="458" fill="url(#bg-samsung-agm)" />

    <!-- Ambient Subtle Glows -->
    <circle cx="720" cy="120" r="140" fill="#10b981" opacity="0.08" />
    <circle cx="100" cy="380" r="140" fill="#059669" opacity="0.06" />

    <!-- Platform Header -->
    <rect width="800" height="46" fill="#000000" fill-opacity="0.35" />
    <line x1="0" y1="46" x2="800" y2="46" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <rect x="28" y="13" width="20" height="20" rx="5" fill="url(#accent-agm)" />
    <text x="56" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Samsung SDS • Annual General Meeting (AGM) Platform</text>
    <text x="56" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Broadcast Shell &amp; Accessible Voting State Machine Architecture</text>

    <!-- NDA Security Pill Badge -->
    <g transform="translate(565, 12)">
      <rect width="205" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="12" cy="11" r="3.5" fill="#f59e0b" />
      <text x="22" y="15" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">INTERNAL PLATFORM • NDA SAFE</text>
    </g>

    <!-- Main Workspace Layout: Video Shell (Left) + Voting Component (Right) -->
    <g transform="translate(28, 62)">
      
      <!-- Video Shell Skeleton (Left: 450px) -->
      <g>
        <!-- Main Broadcast Shell Wireframe -->
        <rect width="450" height="235" rx="8" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.1" />
        
        <!-- Live Status Pill Wireframe -->
        <g transform="translate(16, 16)">
          <rect width="90" height="20" rx="10" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-opacity="0.4" />
          <circle cx="12" cy="10" r="3.5" fill="#ef4444" />
          <text x="22" y="13.5" fill="#fca5a5" font-family="system-ui" font-size="8.5" font-weight="700">SESSION SHELL</text>
        </g>

        <!-- Video Player Placeholder Icon & Waveform -->
        <circle cx="225" cy="105" r="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
        <polygon points="220,95 235,105 220,115" fill="#ffffff" fill-opacity="0.7" />
        <text x="225" y="148" fill="#64748b" font-family="system-ui" font-size="9" text-anchor="middle">Responsive Video Stream Container (16:9 Aspect Ratio)</text>

        <!-- Stream Player Controls Bar -->
        <rect x="16" y="185" width="418" height="34" rx="6" fill="#ffffff" fill-opacity="0.04" />
        <circle cx="36" cy="202" r="7" fill="#10b981" />
        <rect x="52" y="199" width="120" height="6" rx="3" fill="#ffffff" fill-opacity="0.2" />
        <rect x="360" y="196" width="60" height="12" rx="6" fill="#ffffff" fill-opacity="0.1" />

        <!-- Lower Agenda Tracker Wireframe -->
        <g transform="translate(0, 248)">
          <rect width="450" height="120" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07" />
          <text x="16" y="24" fill="#ffffff" font-family="system-ui" font-size="10.5" font-weight="700">Agenda Progress &amp; Quorum Component</text>
          
          <line x1="16" y1="36" x2="434" y2="36" stroke="#ffffff" stroke-opacity="0.05" />
          
          <!-- Agenda Item 1 -->
          <circle cx="26" cy="54" r="5" fill="#10b981" />
          <rect x="38" y="51" width="160" height="6" rx="3" fill="#cbd5e1" opacity="0.7" />
          <rect x="370" y="47" width="55" height="14" rx="7" fill="#10b981" fill-opacity="0.2" />
          <text x="397" y="57" fill="#10b981" font-family="system-ui" font-size="8" font-weight="700" text-anchor="middle">RESOLVED</text>

          <!-- Agenda Item 2 (Active) -->
          <circle cx="26" cy="78" r="5" fill="#38bdf8" />
          <rect x="38" y="75" width="190" height="6" rx="3" fill="#38bdf8" opacity="0.9" />
          <rect x="370" y="71" width="55" height="14" rx="7" fill="#38bdf8" fill-opacity="0.2" />
          <text x="397" y="81" fill="#38bdf8" font-family="system-ui" font-size="8" font-weight="700" text-anchor="middle">ACTIVE</text>

          <!-- Agenda Item 3 -->
          <circle cx="26" cy="102" r="5" fill="#64748b" />
          <rect x="38" y="99" width="140" height="6" rx="3" fill="#64748b" opacity="0.5" />
          <rect x="370" y="95" width="55" height="14" rx="7" fill="#ffffff" fill-opacity="0.05" />
          <text x="397" y="105" fill="#94a3b8" font-family="system-ui" font-size="8" font-weight="700" text-anchor="middle">PENDING</text>
        </g>
      </g>

      <!-- Accessible Voting Panel (Right: 278px) -->
      <g transform="translate(466, 0)">
        <rect width="278" height="368" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#10b981" stroke-opacity="0.3" />
        
        <g transform="translate(16, 18)">
          <rect width="80" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
          <text x="40" y="12" fill="#10b981" font-family="system-ui" font-size="8.5" font-weight="700" text-anchor="middle">BALLOT UI</text>
          
          <text x="0" y="44" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Accessible Voting Module</text>
          <text x="0" y="58" fill="#94a3b8" font-family="system-ui" font-size="8.5">WCAG 2.1 AA Compliant Keyboard Navigation</text>

          <!-- Ballot Item Description Skeleton -->
          <rect x="0" y="72" width="246" height="7" rx="3" fill="#ffffff" fill-opacity="0.2" />
          <rect x="0" y="85" width="180" height="7" rx="3" fill="#ffffff" fill-opacity="0.15" />

          <!-- Vote Button 1: In Favor -->
          <rect x="0" y="110" width="246" height="38" rx="6" fill="#10b981" />
          <text x="123" y="133" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">✓ OPTION A • IN FAVOR</text>

          <!-- Vote Button 2: Against -->
          <rect x="0" y="156" width="246" height="38" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ef4444" stroke-opacity="0.5" />
          <text x="123" y="179" fill="#f87171" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">✗ OPTION B • AGAINST</text>

          <!-- Vote Button 3: Abstain -->
          <rect x="0" y="202" width="246" height="34" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" />
          <text x="123" y="223" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">ABSTAIN</text>

          <!-- Live Component State Machine Status -->
          <g transform="translate(0, 256)">
            <rect width="246" height="76" rx="6" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
            <text x="12" y="18" fill="#94a3b8" font-family="system-ui" font-size="8.5" font-weight="600">FRONTEND STATE MACHINE:</text>
            <text x="12" y="34" fill="#38bdf8" font-family="system-ui" font-size="9" font-weight="600">Idle ➔ Ballot Open ➔ Encrypting ➔ Confirmed</text>
            <text x="12" y="52" fill="#22c55e" font-family="system-ui" font-size="8.5">Focus Trapped • ARIA Live Regions Active</text>
            <text x="12" y="66" fill="#64748b" font-family="system-ui" font-size="7.5">All real voting figures &amp; items masked under NDA</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
