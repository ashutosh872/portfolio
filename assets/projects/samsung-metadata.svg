          <rect x="24" y="166" width="90" height="7" rx="3" fill="#38bdf8" opacity="0.8" />
          <rect x="200" y="166" width="70" height="7" rx="3" fill="#cbd5e1" opacity="0.6" />
          <rect x="350" y="162" width="60" height="16" rx="8" fill="#f59e0b" fill-opacity="0.2" />
          <text x="380" y="174" fill="#f59e0b" font-family="system-ui" font-size="8.5" font-weight="700" text-anchor="middle">SYNCING</text>
