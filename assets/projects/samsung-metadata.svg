    <circle cx="680" cy="80" r="160" fill="#38bdf8" opacity="0.18" filter="blur(40px)" />
    <circle cx="120" cy="360" r="130" fill="#22c55e" opacity="0.12" filter="blur(30px)" />

    <!-- App Header -->
    <rect width="800" height="48" fill="#000000" fill-opacity="0.3" />
    <line x1="0" y1="48" x2="800" y2="48" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <rect x="36" y="14" width="20" height="20" rx="5" fill="url(#accentGlow-samsung-metadata)" />
    <text x="64" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Samsung SDS Metadata</text>

    <!-- Header navigation items mock -->
    <g transform="translate(480, 18)">
      <rect x="0" y="0" width="50" height="12" rx="6" fill="#ffffff" fill-opacity="0.15" />
