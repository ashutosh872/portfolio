          <rect x="24" y="86" width="110" height="7" rx="3" fill="#38bdf8" opacity="0.8" />
          <rect x="200" y="86" width="80" height="7" rx="3" fill="#cbd5e1" opacity="0.6" />
          <rect x="350" y="82" width="60" height="16" rx="8" fill="#22c55e" fill-opacity="0.2" />
          <text x="380" y="94" fill="#22c55e" font-family="system-ui" font-size="8.5" font-weight="700" text-anchor="middle">ACTIVE</text>
